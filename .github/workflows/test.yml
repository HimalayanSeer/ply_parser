name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
        os: [ubuntu-latest]
        include:
          # setup-python has no 3.8 build for Ubuntu 24.04+
          - python: '3.8'
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest tests/test_ply_parser.py -v
